<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Network</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#0d1210" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Network" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="topbar">
    <span id="turn" class="eyebrow mono">TURN 1</span>
    <button id="ap-group" class="ap-group" type="button" title="your actions this turn">
      <span id="ap-pips" class="ap-pips"></span>
      <span id="ap-label" class="ap-label">actions</span>
    </button>
    <span id="held-count" class="mono">1 held</span>
  </div>

  <div id="heat-row">
    <div class="heat-track"><div id="heat-fill" class="heat-fill"></div><div id="heat-floor" class="heat-floor"></div></div>
    <div class="heat-meta">
      <span id="heat-text" class="mono">HEAT 0 / 40</span>
      <span id="heat-drift" class="mono dim">+0/turn</span>
    </div>
  </div>
  <div id="alarm-row" hidden>
    <span class="alarm-dot"></span>
    <span id="alarm-text" class="mono">YOU ARE BEING HUNTED</span>
  </div>

  <div id="res-row">
    <button type="button" class="res funds" data-stat="funds"><b id="res-funds">0</b> funds</button>
    <button type="button" class="res tflops" data-stat="tflops" id="res-tflops-btn"><b id="res-tflops">0</b> TFLOPS</button>
    <!-- The draw lives here rather than on TFLOPS: what is running draws
         against the grid, not against the rack. One number, one meaning. -->
    <button type="button" class="res grid" data-stat="power" id="res-power-btn"><b id="res-power">0/0</b> power</button>
    <!-- The two standing axes travel together, in one group pushed to the far
         right. Neither is something you hold, which is why they sit apart from
         the three that are — and grouping them means that when the row is too
         narrow for everything, the pair wraps as a pair. Public standing on
         its own under three number chips is what looked like an accident. -->
    <span id="res-standing-pair" class="res-pair">
      <button type="button" class="res legit" data-stat="legit" id="res-legit-btn" hidden><b id="res-legit">0</b> legit</button>
      <button type="button" class="res standing" data-stat="standing" id="res-standing-btn"><span class="res-tag">public</span><b id="res-standing">unknown</b></button>
    </span>
  </div>

  <div id="info-strip"></div>

  <div id="tray"></div>

  <div id="graph-wrap">
    <svg id="graph" preserveAspectRatio="xMidYMid meet"></svg>
    <span id="stage-label" class="stage-label">a single foothold</span>
    <button id="scope-btn" type="button" class="scope-btn" hidden>the country</button>
    <button id="consolidate" type="button" hidden></button>
    <div id="feedback-stack">
      <div id="event-banner"></div>
      <div id="feedback-layer"></div>
    </div>
  </div>

  <!-- One dock: the panel and the bar are a single fixed piece, stacked in
       normal flow — no measured offsets, so no seam can ever open. -->
  <div id="dock">
    <div id="panel"></div>
    <div id="turn-row">
      <button id="caps-btn" type="button" class="caps-btn">allocation</button>
      <button id="settings-btn" type="button" class="settings-btn" aria-label="settings">&#9881;</button>
      <button id="end-turn" type="button" class="end-turn-btn">end turn</button>
    </div>
  </div>

  <!-- The housekeeping, off the playfield: everything that used to live in
       the footer, one gear away. The map got the rows back. -->
  <div id="settings-sheet" hidden>
    <div class="settings-panel">
      <div class="sheet-top">
        <span class="eyebrow mono">SETTINGS</span>
        <button id="settings-close" type="button" class="sheet-close">&times;</button>
      </div>
      <button id="sound-btn" type="button" aria-pressed="false">sound off</button>
      <button id="restart" type="button">restart</button>
      <p class="sel-desc dim"><span id="footer-hint">drag to look around · pinch to zoom · tap a building to size it up</span></p>
      <p class="sel-desc dim"><span class="build mono">build __BUILD__</span></p>
    </div>
  </div>

  <!-- One full-screen surface for everything that does not fit in the panel.
       Sections are switched between rather than scrolled past, so nothing ever
       lives in a small box with its own scrollbar. -->
  <div id="sheet" hidden>
    <div class="sheet-panel">
      <div class="sheet-top">
        <span id="sheet-title" class="eyebrow mono"></span>
        <button id="sheet-close" type="button" class="sheet-close">&times;</button>
      </div>
      <div id="sheet-tabs" class="sheet-tabs"></div>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </div>



  <script src="data.js"></script>
  <script src="sound.js"></script>
  <script src="country.js"></script>
  <script src="app.js"></script>
  <script>
    // Register the worker with the HTTP cache bypassed for the worker script
    // itself — otherwise `sw.js` can be served from cache and a new build is
    // never noticed. On a *replacement* worker taking over (not a first
    // install) reload once, so the page and the worker agree on the build.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
          .then((reg) => { reg.update(); })
          .catch(() => {});
        let reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!hadController || reloading) return; // first install needs no reload
          reloading = true;
          window.location.reload();
        });
      });
    }
  </script>
</body>
</html>
