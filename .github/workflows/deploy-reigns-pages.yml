name: Deploy prototypes to GitHub Pages

on:
  push:
    branches: [main, no-swarm]
    paths:
      - 'reigns-prototype/**'
      - 'network-prototype/**'
      - '.github/workflows/deploy-reigns-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      # The card game stays at the site root: it's already installed to a home
      # screen from that URL, and moving it would break the installed app.
      # New prototypes get their own subdirectory.
      - name: Assemble site
        run: |
          mkdir -p site/network
          cp -r reigns-prototype/. site/
          cp -r network-prototype/. site/network/

          # Stamp a unique build id into the service worker and the pages. A
          # byte-different sw.js is what makes the browser install a new worker
          # at all — an unchanged sw.js is never reinstalled, so the old one
          # keeps serving no matter what else changed.
          BUILD="$(date -u +%Y%m%d-%H%M)-$(echo "$GITHUB_SHA" | cut -c1-7)"
          echo "build id: $BUILD"
          grep -rl '__BUILD__' site | while read -r f; do
            sed -i "s/__BUILD__/$BUILD/g" "$f"
          done
          if grep -rq '__BUILD__' site; then echo "unreplaced __BUILD__ left"; exit 1; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
